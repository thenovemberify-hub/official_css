<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 44" width="320" height="44"><style>
@keyframes tw{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes blink{0%,60%{opacity:1}61%,74%{opacity:.15}75%,100%{opacity:1}}
@keyframes glr{0%,86%,100%{transform:translate(0,0)}88%{transform:translate(-4px,-1px)}91%{transform:translate(3px,1px)}94%{transform:translate(-1px,0)}}
@keyframes glc{0%,86%,100%{transform:translate(0,0)}88%{transform:translate(4px,1px)}91%{transform:translate(-3px,-1px)}94%{transform:translate(1px,0)}}
@keyframes shim{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.tw{animation:tw 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tw2{animation:tw 3.4s ease-in-out .8s infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 4.5s infinite}.glr{animation:glr 5s infinite}.glc{animation:glc 5s infinite}
.shim{animation:shim 3.5s ease-in-out infinite}.rise{animation:rise 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
